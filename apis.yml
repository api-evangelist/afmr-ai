- name: AFMR Discovery MCP Server
  description: Public read-only Model Context Protocol server (ai.afmr/discovery, MCP 2025-11-25, Streamable HTTP,
    stateless, no SSE listening stream) exposing four tools — discover_afmr, lookup_failure_mode, get_reputation_attestation_contract,
    get_lift_evidence_contract — and eight resources. Canonical endpoint https://afmr.ai/api/rpc with https://afmr.ai/mcp
    as an alias; registered in the official MCP Registry.
