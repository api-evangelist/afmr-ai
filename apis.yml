apis:
- name: AFMR Discovery API
  description: 'Read-only discovery for AFMR 1.0, the AFMR Reputation Attestation Working Draft and configuration-only
    Lift Evidence: 21 operations over the discovery documents (afmr.json, agent-card.json, mcp.json, resources.json,
    server.json, agents.json, llms.txt, status.json, changelog.json, feed.xml, sitemap.xml), the Reputation Attestation
    specification, JSON Schema and verifier requirements, the governance-voting contract, the endpoint-conformance
    registry, the evidence map and the Lift Evidence index, plus the MCP JSON-RPC and A2A SendMessage protocol endpoints.
    No authentication; errors are RFC 9457 application/problem+json.'
