domain_standards:
  note: >-
    AFMR is itself a standards publisher for agent governance. The domain standards its contract
    DECLARES for that market are the agent-protocol ones above (A2A 1.0 agent card, MCP 2025-11-25
    server + Registry manifest, ai-plugin v1) plus its own profile: the Reputation Attestation schema
    pins const type "AFMRReputationAttestation" and const profile
    "https://afmr.ai/standards/reputation-attestation/0.1" (schema.json properties.type / .profile).
    No SCIM/OData/FHIR/etc. applies to this market, and none is claimed.
