  title: Look up AFMR failure modes
  description: Find exact AFMR 1.0 failure-mode records by permanent ID or bounded text query.
  inputSchema:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: ^AFMR-F[0-9]{3}$
        description: Exact permanent family identifier, for example AFMR-F010.
      query:
        type: string
        minLength: 2
        maxLength: 100
        description: Text matched against ID, name, definition, and class.
      limit:
        type: integer
        minimum: 1
        maximum: 10
        default: 5
    anyOf:
    - required:
      - id
    - required:
      - query
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
